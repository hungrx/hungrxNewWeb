      track('order_chat_reply', { step });
      tag(step === 1 ? 'chat_place' : 'chat_order', text);
      if (step === 1) {
        strikes = 0;
        chain = detectChain(name || text); place = name || text;
        await botSays(chain === DATA.other && name ? 'ooh ' + name + ', nice' : chain.react);
        await botSays(chain.ask);
      } else if (step === 2) {
        const res = await askAI(text);
        if (res && !res.ok && res.reason === 'not_food') {
          step = 1; strikes++;
          track('order_chat_rejected', { step: 2, why: 'ai_not_food' }); tag('rejected_2', 'ai_not_food: ' + text);
          if (strikes >= 2) { await softClose(); return; }
          await botSays("hmm i don't think that's on their menu 😅 " + chain.ask);
          lock(false); return;
        }
        if (res && res.ok) {
          const t = res.estimate ? '~' : '';
          tag('chat_cal', res.cal); tag('chat_swap', res.swap);
          await botSays(res.item + (res.assumed ? ' (' + res.assumed + ')' : '') + ' = **' + t + n(res.cal) + ' cal**\n' + res.p + 'g protein · ' + res.c + 'g carbs · ' + res.f + 'g fat');
          await botSays('easy swap: ' + res.swap + ' → **' + t + n(res.swapCal) + ' cal**. ' + res.keep + ', **' + n(res.cal - res.swapCal) + ' cal cut** 😳');
          track('order_chat_reveal', { ok: true });
        } else {
          await botSays("couldn't pull the exact numbers for that one 😅 the app has the full menu with every calorie");
          track('order_chat_reveal', { ok: false, reason: (res && res.reason) || 'error' });
        }
        await botSays("now let's personalize it to you, so you see what fits your calories at restaurants near you. takes 40 sec 👇");
        await wait(300); showCard(); endChat();
        return;
      }
      lock(false);
    }

    $('send').addEventListener('click', () => { send($('input').value); $('input').focus(); });
    $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send($('input').value); } });
    $('input').addEventListener('input', e => $('field').classList.toggle('has', e.target.value.trim().length > 0));

    (async function start() {
      lock(true);
      track('order_chat_open');
      await wait(500);
      await botSays('hey! quick one, where do you end up eating out the most?');
      lock(false);
    })();
  </script>
</body>
</html>
